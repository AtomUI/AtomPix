  <text x="100" y="171" class="heading">首页 · 正在打开来源</text><rect x="374" y="154" width="82" height="24" rx="12" fill="#eef2ff"/><text x="415" y="171" text-anchor="middle" class="state" fill="#4f6bed">LOADING</text>
