<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#263142}.muted{fill:#718096}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:22px;font-weight:650}.heading{font-size:16px;font-weight:650}.btn{font-size:13px;font-weight:600}.state{font-size:11px;font-weight:650}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#233044" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="900" fill="#e8edf3"/><rect x="40" y="30" width="1360" height="840" rx="18" fill="#fff" filter="url(#s)"/>
  <text x="80" y="78" class="title">四类单张编辑器 · 公共状态</text><text x="80" y="106" class="small muted">来源、参数草稿和正式任务互相独立；运行时锁定编辑，终态留在原页。</text>
  <rect x="1170" y="52" width="190" height="36" rx="18" fill="#eef2ff"/><text x="1265" y="75" text-anchor="middle" class="tiny" fill="#4f6bed">原型 12 · 状态画板</text>

  <!-- empty -->
  <rect x="80" y="140" width="300" height="286" rx="14" fill="#fff" stroke="#dce3eb"/><text x="102" y="174" class="heading">01 · 尚未选择图片</text><rect x="282" y="154" width="78" height="24" rx="12" fill="#edf2f7"/><text x="321" y="171" text-anchor="middle" class="state">EMPTY</text>
  <rect x="102" y="200" width="256" height="118" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/><circle cx="230" cy="238" r="18" fill="#eef2ff"/><path d="M220 238h20M230 228v20" stroke="#4f6bed" stroke-width="2"/><text x="230" y="284" text-anchor="middle" class="small muted">选择一张图片开始</text>
  <rect x="102" y="338" width="256" height="40" rx="8" fill="#4f6bed"/><text x="230" y="363" text-anchor="middle" class="btn" fill="#fff">选择图片</text><rect x="102" y="388" width="256" height="24" rx="6" fill="#f1f4f8"/><text x="230" y="405" text-anchor="middle" class="tiny muted">开始按钮禁用</text>

  <!-- editable draft -->
  <rect x="400" y="140" width="440" height="286" rx="14" fill="#fff" stroke="#dce3eb"/><text x="422" y="174" class="heading">02 · 参数草稿就绪</text><rect x="738" y="154" width="82" height="24" rx="12" fill="#eef2ff"/><text x="779" y="171" text-anchor="middle" class="state" fill="#4f6bed">READY</text>
  <rect x="422" y="198" width="200" height="122" rx="10" fill="#202733"/><path d="M422 286c55-60 96-20 126-54 30 38 46 16 74 54v34H422z" fill="#7193a2"/><circle cx="570" cy="232" r="14" fill="#eedab3"/>
  <text x="644" y="210" class="tiny muted">参数草稿</text><text x="644" y="242" class="small" font-weight="650">自定义质量 · 76</text><text x="644" y="268" class="tiny muted">参数合法，可开始处理</text><text x="644" y="294" class="tiny muted">提交后创建独立正式任务</text>
  <rect x="422" y="338" width="190" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="517" y="362" text-anchor="middle" class="small">更换图片</text><rect x="622" y="338" width="196" height="38" rx="8" fill="#4f6bed"/><text x="720" y="362" text-anchor="middle" class="btn" fill="#fff">开始处理</text><text x="422" y="404" class="tiny muted">Draft 与 ExecutionState 分离。</text>

  <!-- running -->
  <rect x="860" y="140" width="500" height="286" rx="14" fill="#fff" stroke="#dce3eb"/><text x="882" y="174" class="heading">03 · 正式任务运行</text><rect x="1252" y="154" width="88" height="24" rx="12" fill="#eef2ff"/><text x="1296" y="171" text-anchor="middle" class="state" fill="#4f6bed">RUNNING</text>
  <rect x="882" y="200" width="456" height="88" rx="10" fill="#eef2ff"/><circle cx="920" cy="244" r="14" fill="none" stroke="#4f6bed" stroke-width="3" stroke-dasharray="18 7"/><text x="950" y="237" class="small" font-weight="650">正在压缩 DSC_2048.jpg</text><text x="950" y="261" class="tiny muted">导航、换图、参数和重复提交均已锁定</text>
  <rect x="882" y="306" width="214" height="38" rx="8" fill="#f1f4f8"/><text x="989" y="330" text-anchor="middle" class="small muted">参数已锁定</text><rect x="1106" y="306" width="232" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="1222" y="330" text-anchor="middle" class="small">取消任务</text>
  <text x="882" y="374" class="tiny muted">单张直接取消；关闭窗口仍需确认并等待终态。</text>

  <!-- success -->
  <rect x="80" y="454" width="390" height="330" rx="14" fill="#fff" stroke="#dce3eb"/><text x="102" y="488" class="heading">04 · 成功留在原页</text><rect x="368" y="468" width="82" height="24" rx="12" fill="#e7f6ec"/><text x="409" y="485" text-anchor="middle" class="state" fill="#2f855a">SUCCESS</text>
  <rect x="102" y="514" width="346" height="118" rx="10" fill="#eef6f1"/><circle cx="138" cy="554" r="16" fill="#38a169"/><path d="M130 554l6 6 11-13" fill="none" stroke="#fff" stroke-width="3"/><text x="168" y="550" class="small" font-weight="650">处理完成</text><text x="168" y="574" class="tiny muted">输出：AtomPix_Output/photo_atompix.jpg</text><text x="168" y="598" class="tiny" fill="#9a5a13">体积增加 20 KB · 4%（结果已保存）</text><text x="118" y="620" class="tiny muted">成功不承诺变小；编辑不会删除输出。</text>
  <rect x="102" y="650" width="164" height="38" rx="8" fill="#4f6bed"/><text x="184" y="674" text-anchor="middle" class="btn" fill="#fff">再次处理</text><rect x="278" y="650" width="170" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="363" y="674" text-anchor="middle" class="small">打开输出目录</text><rect x="102" y="700" width="346" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="275" y="724" text-anchor="middle" class="small">继续调尺寸（使用本次输出）</text><text x="102" y="766" class="tiny muted">修改参数或换图后进入新草稿。</text>

  <!-- failure and canceled -->
  <rect x="490" y="454" width="390" height="330" rx="14" fill="#fff" stroke="#dce3eb"/><text x="512" y="488" class="heading">05 · 失败与取消</text><rect x="778" y="468" width="82" height="24" rx="12" fill="#fee2e2"/><text x="819" y="485" text-anchor="middle" class="state" fill="#c53030">ENDED</text>
  <rect x="512" y="514" width="346" height="104" rx="10" fill="#fff1f1"/><text x="530" y="544" class="small" font-weight="650">无法写入输出目录</text><text x="530" y="568" class="tiny muted">Permission · 未留下临时文件或半成品</text><text x="530" y="592" class="tiny" fill="#4f6bed">选择其他目录并创建新任务</text>
  <rect x="512" y="634" width="346" height="78" rx="10" fill="#f3f6f9"/><text x="530" y="663" class="small" font-weight="650">任务已取消</text><text x="530" y="687" class="tiny muted">Canceled 不是 Failed；参数仍可编辑</text>
  <rect x="512" y="730" width="166" height="38" rx="8" fill="#4f6bed"/><text x="595" y="754" text-anchor="middle" class="btn" fill="#fff">选择其他目录</text><rect x="690" y="730" width="168" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="774" y="754" text-anchor="middle" class="small">返回编辑</text>

  <!-- output conflict modal -->
  <rect x="900" y="454" width="460" height="330" rx="14" fill="#f8fafc" stroke="#dce3eb"/><text x="922" y="488" class="heading">06 · 输出文件冲突</text><rect x="1240" y="468" width="100" height="24" rx="12" fill="#eef2ff"/><text x="1290" y="485" text-anchor="middle" class="state" fill="#4f6bed">MODAL</text>
  <rect x="950" y="524" width="360" height="224" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#s)"/><text x="974" y="558" class="heading">目标文件已存在</text><text x="974" y="590" class="tiny muted">photo_atompix.jpg</text><rect x="974" y="608" width="312" height="54" rx="8" fill="#fff7ed"/><text x="990" y="631" class="tiny" fill="#9a5a13">请选择本次任务的处理方式</text><text x="990" y="650" class="tiny muted">不会覆盖本次任务的输入图片</text><rect x="974" y="680" width="98" height="32" rx="7" fill="#4f6bed"/><text x="1023" y="701" text-anchor="middle" class="tiny" fill="#fff">自动重命名</text><rect x="1080" y="680" width="92" height="32" rx="7" fill="#fff" stroke="#b8c4d0"/><text x="1126" y="701" text-anchor="middle" class="tiny">跳过</text><rect x="1180" y="680" width="106" height="32" rx="7" fill="#fff" stroke="#b8c4d0"/><text x="1233" y="701" text-anchor="middle" class="tiny">覆盖目标</text>
  <text x="922" y="770" class="tiny muted">取消后保留当前草稿；修改策略后仍需重新点击开始。</text>
  <text x="80" y="844" class="tiny muted">原型 12 · 四类单张编辑器公共状态 · 中保真</text>
</svg>
