<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #263142; }
      .muted { fill: #718096; }
      .tiny { font-size: 12px; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .title { font-size: 22px; font-weight: 650; }
      .heading { font-size: 17px; font-weight: 650; }
      .label { font-size: 13px; font-weight: 600; }
      .nav { font-size: 14px; }
      .btn { font-size: 14px; font-weight: 600; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#233044" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="#e8edf3"/>
  <rect x="40" y="30" width="1360" height="840" rx="18" fill="#ffffff" filter="url(#shadow)"/>

  <!-- title bar -->
  <path d="M58 30h1324a18 18 0 0 1 18 18v48H40V48a18 18 0 0 1 18-18z" fill="#f8fafc"/>
  <line x1="40" y1="96" x2="1400" y2="96" stroke="#dce3eb"/>
  <rect x="62" y="50" width="28" height="28" rx="8" fill="#4f6bed"/>
  <circle cx="76" cy="64" r="7" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="76" cy="64" r="2" fill="#fff"/>
  <text x="102" y="69" class="heading">AtomPix</text>
  <circle cx="1368" cy="54" r="5" fill="#94a3b8"/><circle cx="1384" cy="54" r="5" fill="#94a3b8"/>

  <!-- navigation -->
  <rect x="40" y="96" width="190" height="774" fill="#f8fafc"/>
  <line x1="230" y1="96" x2="230" y2="870" stroke="#dce3eb"/>
  <text x="62" y="131" class="tiny muted">工作区</text>
  <rect x="52" y="145" width="166" height="44" rx="9" fill="#e9efff"/>
  <rect x="67" y="158" width="18" height="16" rx="3" fill="none" stroke="#4f6bed" stroke-width="2"/>
  <path d="M68 175l5-5 4 3 4-5 4 7" fill="none" stroke="#4f6bed" stroke-width="1.6"/>
  <text x="98" y="173" class="nav" fill="#3551be" font-weight="650">浏览</text>
  <g class="nav">
    <circle cx="76" cy="214" r="9" fill="none" stroke="#78869a" stroke-width="2"/><path d="M73 214h6M76 211v6" stroke="#78869a" stroke-width="2"/>
    <text x="98" y="219">压缩</text>
    <path d="M68 252h16M78 247l6 5-6 5M74 264H58M64 259l-6 5 6 5" transform="translate(8 -6)" fill="none" stroke="#78869a" stroke-width="2"/>
    <text x="98" y="260">转换</text>
    <path d="M68 294h16M68 302h16M71 290v16M81 290v16" fill="none" stroke="#78869a" stroke-width="1.6"/>
    <text x="98" y="303">调整尺寸</text>
    <path d="M68 330h16v16H68zM64 334h8M80 342h8" fill="none" stroke="#78869a" stroke-width="1.7"/>
    <text x="98" y="343">裁剪</text>
    <rect x="67" y="370" width="18" height="16" rx="3" fill="none" stroke="#78869a" stroke-width="2"/><path d="M71 375h10M71 381h7" stroke="#78869a" stroke-width="1.5"/>
    <text x="98" y="383">批量任务</text>
  </g>
  <line x1="61" y1="414" x2="209" y2="414" stroke="#e1e7ee"/>
  <text x="62" y="443" class="tiny muted">应用</text>
  <circle cx="76" cy="473" r="9" fill="none" stroke="#78869a" stroke-width="2"/><path d="M76 460v5M76 481v5M63 473h5M84 473h5" stroke="#78869a" stroke-width="2"/>
  <text x="98" y="478" class="nav">设置</text>
  <rect x="56" y="788" width="158" height="58" rx="10" fill="#ffffff" stroke="#dde4ec"/>
  <text x="70" y="811" class="label">本地处理</text>
  <text x="70" y="830" class="tiny muted">图片不会上传到云端</text>

  <!-- main -->
  <text x="270" y="139" class="title">开始使用 AtomPix</text>
  <text x="270" y="166" class="small muted">打开图片或文件夹，开始压缩、转换、调整尺寸或裁剪。</text>

  <rect x="270" y="194" width="760" height="394" rx="18" fill="#fbfcfe" stroke="#9badc0" stroke-width="2" stroke-dasharray="9 8"/>
  <rect x="573" y="263" width="154" height="110" rx="16" fill="#eef2f7"/>
  <rect x="612" y="285" width="76" height="57" rx="7" fill="#ffffff" stroke="#8ea0b5" stroke-width="2"/>
  <circle cx="672" cy="300" r="7" fill="#c4ced9"/>
  <path d="M619 334l17-17 12 10 10-14 23 21z" fill="#b2c0cf"/>
  <path d="M688 355c18-15 33-15 48 0" fill="none" stroke="#4f6bed" stroke-width="3" stroke-linecap="round"/>
  <path d="M729 348l8 7-8 7" fill="none" stroke="#4f6bed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="650" y="411" text-anchor="middle" class="heading">拖入图片或文件夹</text>
  <text x="650" y="437" text-anchor="middle" class="small muted">支持 JPEG、PNG、WebP、BMP、GIF、TIFF</text>
  <rect x="469" y="468" width="164" height="44" rx="9" fill="#4f6bed"/>
  <text x="551" y="495" text-anchor="middle" class="btn" fill="#fff">打开图片</text>
  <rect x="648" y="468" width="164" height="44" rx="9" fill="#ffffff" stroke="#9badc0"/>
  <text x="730" y="495" text-anchor="middle" class="btn">打开文件夹</text>
  <text x="650" y="548" text-anchor="middle" class="tiny muted">所有处理均在本地完成</text>

  <!-- recent -->
  <text x="1068" y="212" class="heading">最近打开</text>
  <text x="1348" y="212" text-anchor="end" class="small" fill="#4f6bed">查看全部</text>
  <rect x="1068" y="232" width="292" height="84" rx="12" fill="#ffffff" stroke="#dce3eb"/>
  <rect x="1080" y="244" width="60" height="60" rx="8" fill="#dde5ee"/>
  <circle cx="1124" cy="260" r="5" fill="#fff"/><path d="M1087 296l17-17 10 9 8-11 12 19z" fill="#aebdcb"/>
  <text x="1153" y="262" class="small" font-weight="600">旅行照片</text>
  <text x="1153" y="283" class="tiny muted">文件夹 · 24 张图片</text>
  <text x="1153" y="301" class="tiny muted">今天 10:24</text>
  <rect x="1068" y="328" width="292" height="84" rx="12" fill="#ffffff" stroke="#dce3eb"/>
  <rect x="1080" y="340" width="60" height="60" rx="8" fill="#e6e2dc"/>
  <path d="M1085 390l18-25 15 13 10-14 8 26z" fill="#c5b9aa"/>
  <text x="1153" y="358" class="small" font-weight="600">cover-photo.png</text>
  <text x="1153" y="379" class="tiny muted">PNG · 4.8 MB</text>
  <text x="1153" y="397" class="tiny muted">昨天 18:42</text>

  <!-- quick actions -->
  <text x="270" y="634" class="heading">快捷操作</text>
  <rect x="270" y="654" width="178" height="142" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
  <circle cx="300" cy="688" r="18" fill="#e9efff"/><path d="M291 688h18M300 679v18" stroke="#4f6bed" stroke-width="2"/>
  <text x="326" y="690" class="heading">压缩图片</text>
  <text x="288" y="730" class="tiny muted">减小文件体积</text><text x="288" y="763" class="small" fill="#4f6bed">选择图片  →</text>
  <rect x="460" y="654" width="178" height="142" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
  <circle cx="490" cy="688" r="18" fill="#e9efff"/><path d="M482 684h16l-5-5M498 692h-16l5 5" fill="none" stroke="#4f6bed" stroke-width="2"/>
  <text x="516" y="690" class="heading">转换格式</text>
  <text x="478" y="730" class="tiny muted">导出为常用格式</text><text x="478" y="763" class="small" fill="#4f6bed">选择图片  →</text>
  <rect x="650" y="654" width="178" height="142" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
  <circle cx="680" cy="688" r="18" fill="#e9efff"/><path d="M672 681h16v14h-16zM676 677v8M684 691v8" fill="none" stroke="#4f6bed" stroke-width="2"/>
  <text x="706" y="690" class="heading">调整尺寸</text>
  <text x="668" y="730" class="tiny muted">Pixel 或百分比</text><text x="668" y="763" class="small" fill="#4f6bed">选择图片  →</text>
  <rect x="840" y="654" width="190" height="142" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
  <circle cx="870" cy="688" r="18" fill="#e9efff"/><path d="M862 680h16v16h-16zM858 684h8M874 692h8" fill="none" stroke="#4f6bed" stroke-width="2"/>
  <text x="896" y="690" class="heading">裁剪图片</text>
  <text x="858" y="730" class="tiny muted">选区、比例与坐标</text><text x="858" y="763" class="small" fill="#4f6bed">选择图片  →</text>

  <text x="270" y="839" class="tiny muted">原型 01 · 首页 / 空态 · 中保真</text>
</svg>
