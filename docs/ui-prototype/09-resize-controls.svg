<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#263142}.muted{fill:#718096}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:20px;font-weight:650}.heading{font-size:16px;font-weight:650}.btn{font-size:14px;font-weight:600}</style>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#233044" flood-opacity=".12"/></filter>
    <pattern id="checker" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#eef2f6"/><rect width="9" height="9" fill="#e0e6ed"/><rect x="9" y="9" width="9" height="9" fill="#e0e6ed"/></pattern>
  </defs>
  <rect width="1440" height="900" fill="#e8edf3"/><rect x="40" y="30" width="1360" height="840" rx="18" fill="#fff" filter="url(#s)"/>
  <path d="M58 30h1324a18 18 0 0 1 18 18v48H40V48a18 18 0 0 1 18-18z" fill="#f8fafc"/><line x1="40" y1="96" x2="1400" y2="96" stroke="#dce3eb"/>
  <rect x="62" y="50" width="28" height="28" rx="8" fill="#4f6bed"/><circle cx="76" cy="64" r="7" fill="none" stroke="#fff" stroke-width="3"/><circle cx="76" cy="64" r="2" fill="#fff"/><text x="102" y="69" class="heading">AtomPix</text><text x="270" y="69" class="small muted">调整尺寸</text>

  <!-- main navigation -->
  <rect x="40" y="96" width="190" height="774" fill="#f8fafc"/><line x1="230" y1="96" x2="230" y2="870" stroke="#dce3eb"/><text x="62" y="131" class="tiny muted">工作区</text>
  <text x="98" y="173" class="small">浏览</text><rect x="67" y="158" width="18" height="16" rx="3" fill="none" stroke="#78869a" stroke-width="2"/>
  <text x="98" y="217" class="small">压缩</text><circle cx="76" cy="212" r="9" fill="none" stroke="#78869a" stroke-width="2"/>
  <text x="98" y="261" class="small">转换</text><path d="M68 250h16M78 245l6 5-6 5M74 262H58M64 257l-6 5 6 5" transform="translate(8)" fill="none" stroke="#78869a" stroke-width="2"/>
  <rect x="52" y="278" width="166" height="44" rx="9" fill="#e9efff"/><path d="M68 294h16M68 302h16M71 290v16M81 290v16" fill="none" stroke="#4f6bed" stroke-width="1.7"/><text x="98" y="305" class="small" fill="#3551be" font-weight="650">调整尺寸</text>
  <path d="M68 330h16v16H68zM64 334h8M80 342h8" fill="none" stroke="#78869a" stroke-width="1.7"/><text x="98" y="349" class="small">裁剪</text>
  <rect x="67" y="374" width="18" height="16" rx="3" fill="none" stroke="#78869a" stroke-width="2"/><path d="M71 379h10M71 385h7" stroke="#78869a"/><text x="98" y="393" class="small">批量任务</text><line x1="61" y1="422" x2="209" y2="422" stroke="#e1e7ee"/><text x="98" y="466" class="small">设置</text>
  <rect x="56" y="760" width="158" height="84" rx="10" fill="#fff" stroke="#dde4ec"/><text x="70" y="785" class="tiny muted">当前图片</text><text x="70" y="807" class="small" font-weight="650">landscape.jpg</text><text x="70" y="828" class="tiny muted">2400 × 1600 · JPEG</text>

  <!-- page header -->
  <text x="266" y="136" class="title">调整图片尺寸</text><text x="266" y="161" class="small muted">按照 Pixel 或百分比改变 width 和 height；完整图片参与处理，不裁剪、不补边。</text>
  <rect x="1080" y="118" width="282" height="44" rx="9" fill="#fff" stroke="#dce3eb"/><text x="1097" y="145" class="small">landscape.jpg</text><text x="1344" y="145" text-anchor="end" class="tiny" fill="#4f6bed">更换图片</text>

  <!-- preview workspace -->
  <rect x="266" y="184" width="786" height="628" rx="14" fill="#f8fafc" stroke="#dce3eb"/>
  <rect x="286" y="204" width="746" height="48" rx="9" fill="#fff" stroke="#dce3eb"/><text x="304" y="226" class="tiny muted">原图</text><text x="304" y="244" class="small" font-weight="650">2400 × 1600</text><text x="1014" y="235" text-anchor="end" class="tiny muted">JPEG · 8.4 MB</text>
  <rect x="286" y="266" width="746" height="410" rx="10" fill="url(#checker)"/>
  <rect x="366" y="306" width="586" height="330" rx="4" fill="#b9d1dc"/>
  <circle cx="850" cy="360" r="34" fill="#f3e5bd"/><path d="M366 526c92-76 155-27 229-101 82 76 154 26 357 92v119H366z" fill="#7ea2ac"/><path d="M366 572c132-32 234 25 333 30 86 4 162-17 253-41v75H366z" fill="#d2c3a8"/>
  <rect x="382" y="322" width="156" height="30" rx="15" fill="#172033" opacity=".82"/><text x="460" y="342" text-anchor="middle" class="tiny" fill="#fff">完整图片 · 900 × 600</text>
  <path d="M326 471h24M338 459v24" stroke="#4f6bed" stroke-width="2"/><path d="M968 471h24M980 459v24" stroke="#4f6bed" stroke-width="2"/>
  <rect x="286" y="694" width="746" height="98" rx="10" fill="#fff" stroke="#dce3eb"/>
  <text x="304" y="720" class="tiny muted">预计输出尺寸</text><text x="304" y="750" class="title" fill="#2f855a">900 × 600 px</text><text x="304" y="774" class="tiny muted">保持比例且同时填写宽高时，使用较小约束：600 / 1600。</text>
  <text x="1014" y="720" text-anchor="end" class="tiny muted">输出位置</text><text x="1014" y="748" text-anchor="end" class="small" font-weight="650">AtomPix_Output</text><text x="1014" y="774" text-anchor="end" class="tiny muted">自动重命名 · 保留 JPEG</text>

  <!-- resize settings -->
  <rect x="1076" y="184" width="286" height="628" rx="14" fill="#fff" stroke="#dce3eb"/><text x="1096" y="216" class="heading">调整尺寸设置</text>
  <text x="1096" y="246" class="tiny muted">调整方式</text><rect x="1096" y="258" width="246" height="40" rx="9" fill="#f1f4f8"/><rect x="1100" y="262" width="118" height="32" rx="7" fill="#4f6bed"/><text x="1159" y="283" text-anchor="middle" class="small" fill="#fff" font-weight="650">Pixel</text><text x="1280" y="283" text-anchor="middle" class="small muted">百分比</text>
  <text x="1096" y="328" class="tiny muted">Width</text><text x="1224" y="328" class="tiny muted">Height</text><rect x="1096" y="338" width="118" height="42" rx="8" fill="#fff" stroke="#4f6bed"/><text x="1110" y="364" class="small" font-weight="650">1200</text><text x="1200" y="364" text-anchor="end" class="tiny muted">px</text><rect x="1224" y="338" width="118" height="42" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1238" y="364" class="small" font-weight="650">600</text><text x="1328" y="364" text-anchor="end" class="tiny muted">px</text>
  <rect x="1096" y="398" width="18" height="18" rx="4" fill="#4f6bed"/><path d="M1100 407l4 4 7-9" fill="none" stroke="#fff" stroke-width="2"/><text x="1124" y="412" class="small" font-weight="600">保持比例</text>
  <rect x="1096" y="430" width="246" height="76" rx="9" fill="#eef6f1"/><text x="1112" y="453" class="tiny muted">当前预计输出</text><text x="1112" y="482" class="heading" fill="#2f855a">900 × 600 px</text><text x="1326" y="482" text-anchor="end" class="tiny muted">原图 2400 × 1600</text>
  <rect x="1096" y="520" width="246" height="48" rx="8" fill="#fff7ed"/><text x="1112" y="541" class="tiny" fill="#9a5a13">取消保持比例后必须填写两边</text><text x="1112" y="559" class="tiny muted">并严格输出指定尺寸，允许拉伸</text>
  <line x1="1096" y1="586" x2="1342" y2="586" stroke="#e1e7ee"/>
  <text x="1096" y="614" class="tiny muted">切换到百分比后</text><rect x="1096" y="626" width="74" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1133" y="648" text-anchor="middle" class="tiny">25%</text><rect x="1182" y="626" width="74" height="34" rx="7" fill="#eef2ff" stroke="#4f6bed"/><text x="1219" y="648" text-anchor="middle" class="tiny" fill="#3551be" font-weight="650">50%</text><rect x="1268" y="626" width="74" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1305" y="648" text-anchor="middle" class="tiny">75%</text>
  <text x="1096" y="686" class="tiny muted">自定义百分比</text><rect x="1096" y="696" width="246" height="40" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1112" y="721" class="small">50</text><text x="1326" y="721" text-anchor="end" class="small muted">%</text>
  <text x="1096" y="762" class="tiny muted">百分比同时作用于 width 和 height，</text><text x="1096" y="780" class="tiny muted">始终保持原图比例。</text>
  <rect x="1076" y="824" width="286" height="46" fill="#f8fafc"/><rect x="1096" y="832" width="246" height="38" rx="8" fill="#4f6bed"/><text x="1219" y="856" text-anchor="middle" class="btn" fill="#fff">开始调整尺寸</text>
  <text x="266" y="844" class="tiny muted">原型 09 · 单张调整尺寸 / 主窗口内容页</text>
</svg>
