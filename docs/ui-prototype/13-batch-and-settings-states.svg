<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#263142}.muted{fill:#718096}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:22px;font-weight:650}.heading{font-size:16px;font-weight:650}.btn{font-size:13px;font-weight:600}.state{font-size:11px;font-weight:650}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#233044" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="900" fill="#e8edf3"/><rect x="40" y="30" width="1360" height="840" rx="18" fill="#fff" filter="url(#s)"/>
  <text x="80" y="78" class="title">批量任务与设置 · 关键状态</text><text x="80" y="106" class="small muted">批量任务使用不可变运行快照；设置使用显式保存和 Dirty 草稿。</text>
  <rect x="1170" y="52" width="190" height="36" rx="18" fill="#eef2ff"/><text x="1265" y="75" text-anchor="middle" class="tiny" fill="#4f6bed">原型 13 · 状态画板</text>

  <!-- batch ready draft, shared custom quality and naming -->
  <rect x="80" y="140" width="420" height="300" rx="14" fill="#fff" stroke="#dce3eb"/><text x="102" y="174" class="heading">批量 · Ready 共享参数</text><rect x="398" y="154" width="82" height="24" rx="12" fill="#eef6f1"/><text x="439" y="171" text-anchor="middle" class="state" fill="#2f855a">READY</text>
  <rect x="102" y="194" width="376" height="46" rx="10" fill="#f8fafc"/><text x="120" y="216" class="small" font-weight="650">批量压缩 · 8 个输入 · 自定义</text><text x="120" y="233" class="tiny muted">质量 76 对全部有损项目共享；不提供逐项覆盖</text>
  <rect x="102" y="250" width="180" height="32" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="192" y="271" text-anchor="middle" class="small">＋ 添加文件</text><rect x="298" y="250" width="180" height="32" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="388" y="271" text-anchor="middle" class="small">＋ 添加文件夹</text>
  <text x="102" y="303" class="tiny muted">文件名格式</text><rect x="102" y="311" width="376" height="34" rx="8" fill="#fff" stroke="#4f6bed"/><text x="118" y="333" class="small">{name}_atompix_{index}</text>
  <text x="102" y="369" class="tiny muted">共享自定义质量 · 1–100</text><line x1="102" y1="389" x2="390" y2="389" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/><line x1="102" y1="389" x2="320" y2="389" stroke="#4f6bed" stroke-width="5" stroke-linecap="round"/><circle cx="320" cy="389" r="7" fill="#fff" stroke="#4f6bed" stroke-width="3"/><rect x="420" y="372" width="58" height="34" rx="7" fill="#fff" stroke="#4f6bed"/><text x="449" y="394" text-anchor="middle" class="small" font-weight="650">76</text>
  <text x="102" y="425" class="tiny muted">混合批次显示受影响项数；提交后参数与序号一并冻结</text>

  <!-- batch running -->
  <rect x="520" y="140" width="420" height="300" rx="14" fill="#fff" stroke="#dce3eb"/><text x="542" y="174" class="heading">批量 · 运行锁定</text><rect x="838" y="154" width="82" height="24" rx="12" fill="#eef2ff"/><text x="879" y="171" text-anchor="middle" class="state" fill="#4f6bed">RUNNING</text>
  <text x="542" y="214" class="small" font-weight="650">5 / 8 · 当前 portrait.png</text><rect x="542" y="230" width="356" height="10" rx="5" fill="#dce3eb"/><rect x="542" y="230" width="222" height="10" rx="5" fill="#4f6bed"/><text x="542" y="266" class="tiny muted">成功 3　跳过 1　失败 1</text>
  <rect x="542" y="286" width="356" height="54" rx="9" fill="#f1f4f8"/><text x="560" y="309" class="small muted">标签、添加、移除和参数修改已锁定</text><text x="560" y="329" class="tiny muted">当前设置以提交时快照只读显示</text>
  <rect x="542" y="358" width="170" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="627" y="382" text-anchor="middle" class="small">取消任务</text><rect x="728" y="358" width="170" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="813" y="382" text-anchor="middle" class="small">打开输出目录</text><text x="542" y="421" class="tiny muted">取消前确认；已完成结果保留。</text>

  <!-- cancel modal -->
  <rect x="960" y="140" width="400" height="300" rx="14" fill="#f8fafc" stroke="#dce3eb"/><text x="982" y="174" class="heading">批量 · 取消确认</text><rect x="1250" y="154" width="90" height="24" rx="12" fill="#fff7ed"/><text x="1295" y="171" text-anchor="middle" class="state" fill="#9a5a13">MODAL</text>
  <rect x="1006" y="214" width="308" height="178" rx="14" fill="#fff" stroke="#cbd5e1" filter="url(#s)"/><text x="1030" y="248" class="heading">取消当前批量任务？</text><text x="1030" y="280" class="small muted">已完成的 5 项结果会保留。</text><text x="1030" y="304" class="small muted">未开始项目不会继续处理。</text><rect x="1030" y="334" width="116" height="36" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="1088" y="357" text-anchor="middle" class="small">继续任务</text><rect x="1156" y="334" width="134" height="36" rx="8" fill="#4f6bed"/><text x="1223" y="357" text-anchor="middle" class="btn" fill="#fff">确认取消</text>
  <text x="982" y="421" class="tiny muted">关闭弹窗等同“继续任务”。</text>

  <!-- batch terminal -->
  <rect x="80" y="466" width="600" height="326" rx="14" fill="#fff" stroke="#dce3eb"/><text x="102" y="500" class="heading">批量 · 部分完成终态</text><rect x="550" y="480" width="110" height="24" rx="12" fill="#fff7ed"/><text x="605" y="497" text-anchor="middle" class="state" fill="#9a5a13">PARTIAL</text>
  <rect x="102" y="524" width="556" height="64" rx="10" fill="#fff7ed"/><text x="120" y="550" class="small" font-weight="650">成功 5 · 失败 2 · 跳过 1</text><text x="120" y="574" class="tiny muted">旧任务保持只读；重试会创建新任务</text>
  <rect x="102" y="606" width="556" height="84" rx="10" fill="#fff" stroke="#dce3eb"/><text x="120" y="632" class="small">animated.gif</text><text x="330" y="632" class="tiny muted">多帧输入暂不支持</text><text x="638" y="632" text-anchor="end" class="tiny" fill="#4f6bed">移出后重试</text><text x="120" y="668" class="small">missing.jpg</text><text x="330" y="668" class="tiny muted">找不到输入文件</text><text x="638" y="668" text-anchor="end" class="tiny" fill="#4f6bed">重新定位</text>
  <rect x="102" y="710" width="170" height="38" rx="8" fill="#4f6bed"/><text x="187" y="734" text-anchor="middle" class="btn" fill="#fff">重试失败项</text><rect x="284" y="710" width="170" height="38" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="369" y="734" text-anchor="middle" class="small">打开输出目录</text><rect x="466" y="710" width="192" height="38" rx="8" fill="#fff" stroke="#4f6bed"/><text x="562" y="734" text-anchor="middle" class="small" fill="#4f6bed">继续处理其他图片</text><text x="102" y="775" class="tiny muted">继续后进入新的 Empty 草稿，不向旧任务追加。</text>

  <!-- settings dirty/saving -->
  <rect x="704" y="466" width="656" height="326" rx="14" fill="#fff" stroke="#dce3eb"/><text x="726" y="500" class="heading">设置 · 显式保存</text><circle cx="1250" cy="492" r="5" fill="#d69e2e"/><text x="1338" y="497" text-anchor="end" class="tiny muted">有未保存修改</text>
  <rect x="726" y="524" width="294" height="120" rx="10" fill="#f8fafc" stroke="#dce3eb"/><text x="744" y="550" class="small" font-weight="650">Dirty 草稿</text><text x="744" y="574" class="tiny muted">默认压缩 Custom + 76 作为一组修改</text><rect x="744" y="594" width="120" height="34" rx="8" fill="#4f6bed"/><text x="804" y="616" text-anchor="middle" class="tiny" fill="#fff">保存设置</text><rect x="876" y="594" width="120" height="34" rx="8" fill="#fff" stroke="#b8c4d0"/><text x="936" y="616" text-anchor="middle" class="tiny">恢复默认</text>
  <rect x="1034" y="524" width="304" height="120" rx="10" fill="#eef2ff"/><text x="1052" y="550" class="small" font-weight="650">Saving</text><circle cx="1070" cy="584" r="9" fill="none" stroke="#4f6bed" stroke-width="2" stroke-dasharray="10 4"/><text x="1090" y="588" class="tiny muted">保存期间表单与按钮禁用</text><text x="1052" y="620" class="tiny muted">成功后更新 OriginalValue 并清除 Dirty</text>
  <rect x="726" y="662" width="294" height="92" rx="10" fill="#fff1f1"/><text x="744" y="690" class="small" font-weight="650">保存失败</text><text x="744" y="714" class="tiny muted">草稿与 Dirty 保留，可重试或放弃</text><text x="744" y="738" class="tiny" fill="#4f6bed">重试保存</text>
  <rect x="1034" y="662" width="304" height="92" rx="10" fill="#fff7ed"/><text x="1052" y="690" class="small" font-weight="650">恢复默认确认</text><text x="1052" y="714" class="tiny muted">确认后只修改草稿，仍需点击保存</text><text x="1052" y="738" class="tiny" fill="#4f6bed">离页：保存 / 放弃 / 留在当前页</text>
  <text x="80" y="844" class="tiny muted">原型 13 · 批量任务与设置状态 · 中保真</text>
</svg>
