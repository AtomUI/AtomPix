<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs><style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#263142}.muted{fill:#718096}.tiny{font-size:12px}.small{font-size:14px}.body{font-size:16px}.title{font-size:22px;font-weight:650}.heading{font-size:16px;font-weight:650}.btn{font-size:13px;font-weight:600}</style><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#233044" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="900" fill="#e8edf3"/><rect x="40" y="30" width="1360" height="840" rx="18" fill="#fff" filter="url(#s)"/>
  <text x="80" y="82" class="title">AtomPix 关键状态与错误反馈</text><text x="80" y="110" class="small muted">错误由 AtomPixErrorCode 映射为用户文案；底层异常消息不直接展示。</text>
  <rect x="1114" y="56" width="246" height="36" rx="18" fill="#eef2ff"/><text x="1237" y="79" text-anchor="middle" class="tiny" fill="#4f6bed">原型 08 · 状态画板</text>

  <!-- invalid image -->
  <rect x="80" y="144" width="392" height="218" rx="14" fill="#fff" stroke="#dce3eb"/><rect x="80" y="144" width="392" height="44" rx="14" fill="#f8fafc"/><rect x="80" y="174" width="392" height="14" fill="#f8fafc"/><text x="100" y="172" class="heading">无法打开图片</text><circle cx="126" cy="232" r="24" fill="#fee2e2"/><path d="M126 219v17M126 244h.1" stroke="#c53030" stroke-width="4" stroke-linecap="round"/>
  <text x="164" y="226" class="small" font-weight="650">文件不是有效图片或已经损坏</text><text x="164" y="249" class="tiny muted">holiday.jpg · InvalidImageFile</text><text x="100" y="286" class="small muted">请选择其他图片。AtomPix 不会修改原文件。</text><rect x="100" y="310" width="122" height="34" rx="8" fill="#4f6bed"/><text x="161" y="332" text-anchor="middle" class="btn" fill="#fff">选择其他图片</text><rect x="234" y="310" width="92" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="280" y="332" text-anchor="middle" class="btn">关闭</text>

  <!-- animated -->
  <rect x="490" y="144" width="392" height="218" rx="14" fill="#fff" stroke="#dce3eb"/><rect x="490" y="144" width="392" height="44" rx="14" fill="#f8fafc"/><rect x="490" y="174" width="392" height="14" fill="#f8fafc"/><text x="510" y="172" class="heading">该图片暂不能处理</text><circle cx="536" cy="232" r="24" fill="#fff1d6"/><path d="M526 225h20v16h-20zM531 220h10" fill="none" stroke="#b7791f" stroke-width="2"/>
  <text x="574" y="226" class="small" font-weight="650">检测到动画或多帧图片</text><text x="574" y="249" class="tiny muted">animated.gif · 12 帧</text><text x="510" y="286" class="small muted">可查看第一帧；四项图片处理暂不支持。</text><rect x="510" y="310" width="122" height="34" rx="8" fill="#4f6bed"/><text x="571" y="332" text-anchor="middle" class="btn" fill="#fff">仅查看预览</text><rect x="644" y="310" width="106" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="697" y="332" text-anchor="middle" class="btn">移出任务</text>

  <!-- cancel -->
  <rect x="900" y="144" width="460" height="218" rx="14" fill="#fff" stroke="#dce3eb"/><rect x="900" y="144" width="460" height="44" rx="14" fill="#f8fafc"/><rect x="900" y="174" width="460" height="14" fill="#f8fafc"/><text x="920" y="172" class="heading">任务已取消</text><circle cx="946" cy="232" r="24" fill="#edf2f7"/><rect x="937" y="223" width="18" height="18" rx="3" fill="#718096"/>
  <text x="984" y="226" class="small" font-weight="650">已完成的结果已保留</text><text x="984" y="249" class="tiny muted">完成 5 / 12 · Canceled 不是 Failed</text><rect x="920" y="274" width="420" height="10" rx="5" fill="#dce3eb"/><rect x="920" y="274" width="175" height="10" rx="5" fill="#94a3b8"/><text x="920" y="308" class="tiny muted">后续未开始项目不会产生结果。</text><rect x="920" y="320" width="126" height="32" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="983" y="341" text-anchor="middle" class="btn">查看已完成项</text>

  <!-- source overwrite protection modal -->
  <rect x="80" y="382" width="596" height="214" rx="14" fill="#f8fafc" stroke="#dce3eb"/><text x="102" y="417" class="heading">源文件保护 · 阻断弹窗</text><rect x="556" y="399" width="96" height="24" rx="12" fill="#fee2e2"/><text x="604" y="416" text-anchor="middle" class="tiny" fill="#c53030">START REJECTED</text>
  <rect x="124" y="438" width="508" height="136" rx="12" fill="#fff" stroke="#cbd5e1" filter="url(#s)"/><circle cx="154" cy="468" r="13" fill="#fee2e2"/><text x="154" y="473" text-anchor="middle" class="small" fill="#c53030" font-weight="700">!</text><text x="180" y="473" class="heading">无法覆盖原始图片</text>
  <text x="146" y="500" class="tiny muted">当前输出位置和文件名会覆盖源文件，AtomPix 已阻止任务启动。</text><text x="146" y="521" class="tiny muted">OutputPathConflictsWithInput · 批量时显示冲突图片数量</text>
  <rect x="146" y="535" width="166" height="30" rx="7" fill="#4f6bed"/><text x="229" y="555" text-anchor="middle" class="btn" fill="#fff">改为自动重命名</text><rect x="324" y="535" width="112" height="30" rx="7" fill="#fff" stroke="#b8c4d0"/><text x="380" y="555" text-anchor="middle" class="btn">返回修改</text><text x="610" y="555" text-anchor="end" class="tiny muted">不会自动开始</text>

  <!-- settings corruption -->
  <rect x="694" y="382" width="666" height="214" rx="14" fill="#fff" stroke="#dce3eb"/><rect x="716" y="404" width="622" height="60" rx="10" fill="#fff7ed"/><circle cx="740" cy="434" r="10" fill="#d69e2e"/><text x="740" y="439" text-anchor="middle" class="small" fill="#fff" font-weight="700">!</text><text x="760" y="428" class="small" font-weight="650">无法读取设置</text><text x="760" y="448" class="tiny muted">设置文件可能损坏，AtomPix 没有覆盖原文件。</text>
  <text x="716" y="495" class="small">为避免使用无法解释的配置，图片处理暂未启动。</text><text x="716" y="521" class="tiny muted">SettingsLoadFailed · 高版本 Schema 使用相同阻断流程</text><rect x="716" y="544" width="122" height="34" rx="8" fill="#4f6bed"/><text x="777" y="566" text-anchor="middle" class="btn" fill="#fff">打开设置位置</text><rect x="850" y="544" width="122" height="34" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="911" y="566" text-anchor="middle" class="btn">恢复默认设置</text><text x="1338" y="566" text-anchor="end" class="tiny muted">恢复前必须由用户确认</text>

  <!-- batch failures -->
  <rect x="80" y="616" width="800" height="214" rx="14" fill="#fff" stroke="#dce3eb"/><text x="102" y="650" class="heading">批量任务部分完成</text><text x="858" y="650" text-anchor="end" class="small" font-weight="650">成功 6 · 失败 2 · 跳过 1</text><line x1="102" y1="667" x2="858" y2="667" stroke="#e1e7ee"/>
  <text x="102" y="697" class="tiny muted">文件</text><text x="410" y="697" class="tiny muted">原因</text><text x="840" y="697" text-anchor="end" class="tiny muted">操作</text><text x="102" y="730" class="small">animated.gif</text><text x="410" y="730" class="small">动画/多帧输入暂不支持</text><text x="840" y="730" text-anchor="end" class="tiny" fill="#4f6bed">移出后重试</text><text x="102" y="765" class="small">missing-photo.jpg</text><text x="410" y="765" class="small">找不到输入文件</text><text x="840" y="765" text-anchor="end" class="tiny" fill="#4f6bed">重新定位</text><rect x="102" y="784" width="130" height="32" rx="8" fill="#4f6bed"/><text x="167" y="805" text-anchor="middle" class="btn" fill="#fff">重试失败项</text><rect x="244" y="784" width="130" height="32" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="309" y="805" text-anchor="middle" class="btn">打开输出目录</text>

  <!-- storage and permission -->
  <rect x="900" y="616" width="460" height="214" rx="14" fill="#fff" stroke="#dce3eb"/><text x="922" y="650" class="heading">无法写入输出文件</text><text x="922" y="680" class="small" font-weight="650">没有权限访问所选目录</text><text x="922" y="705" class="tiny muted">ImageWriteFailed / Permission</text><text x="922" y="738" class="small muted">请选择其他输出目录。未留下临时文件或半成品。</text><rect x="922" y="770" width="142" height="36" rx="8" fill="#4f6bed"/><text x="993" y="793" text-anchor="middle" class="btn" fill="#fff">选择其他目录</text><rect x="1076" y="770" width="94" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/><text x="1123" y="793" text-anchor="middle" class="btn">关闭</text>
</svg>
