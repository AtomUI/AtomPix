<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">AtomPix 首页</title>
  <desc id="desc">非沉浸式独立标题栏，左侧图标轨悬浮在浅灰内容区，中央提供打开图片和打开文件夹入口。</desc>
  <defs data-atompix-embedded-assets="true">
    <!-- Self-contained binary assets: keep every design SVG independently previewable. -->
    <symbol id="brand64" viewBox="0 0 64 64"><image href="data:image/png;base64," width="64" height="64"/></symbol>

    <filter id="floatShadow" x="-30%" y="-20%" width="180%" height="160%"><feDropShadow dx="2" dy="5" stdDeviation="9" flood-color="#233044" flood-opacity=".13"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#24324a" flood-opacity=".08"/></filter>
    <style>
      .text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#20242b}.muted{fill:#737b87}.icon{fill:none;stroke:#4e5865;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.railHit{fill:transparent}
    </style>
  </defs>

  <rect width="1280" height="820" fill="#f4f6f9"/>

  <!-- 独立标题栏 -->
  <rect width="1280" height="44" fill="#ffffff"/>
  <use href="#brand64" x="12" y="8" width="27" height="27"/>
  <text class="text" x="48" y="28" font-size="13" font-weight="650">AtomPix</text>
  <g class="icon" stroke-width="1.55">
    <path d="M1188 21h13"/>
    <rect x="1221" y="15" width="12" height="11" rx="1"/>
    <path d="m1256 15 12 12m0-12-12 12"/>
  </g>
  <line x1="0" y1="44.5" x2="1280" y2="44.5" stroke="#dce1e8"/>

  <!-- 首页主内容 -->
  <text class="text" x="96" y="124" font-size="30" font-weight="700">开始使用 AtomPix</text>
  <text class="muted" x="97" y="153" font-family="Microsoft YaHei,Segoe UI" font-size="14">打开图片或文件夹，随后选择需要的处理方式</text>

  <g filter="url(#softShadow)">
    <rect x="76" y="228" width="1128" height="396" rx="18" fill="#ffffff"/>
  </g>
  <rect x="76.5" y="228.5" width="1127" height="395" rx="17.5" fill="none" stroke="#bfc8d4" stroke-width="1.5" stroke-dasharray="8 7"/>
  <g transform="translate(570 310)">
    <circle cx="70" cy="48" r="43" fill="#eef5ff"/>
    <path d="M47 56c0-11 8-19 19-19 4-11 14-18 26-18 16 0 29 13 29 29 10 1 18 9 18 19 0 11-9 20-20 20H62c-12 0-22-10-22-22 0-4 2-7 7-9z" fill="none" stroke="#1677ff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M84 70V43m0 0-11 11m11-11 11 11" fill="none" stroke="#1677ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="text" x="640" y="437" text-anchor="middle" font-size="20" font-weight="650">拖放图片到这里</text>
  <text class="muted" x="640" y="466" text-anchor="middle" font-family="Microsoft YaHei,Segoe UI" font-size="13">或者从电脑中选择需要浏览和处理的图片</text>
  <g transform="translate(444 500)">
    <rect width="184" height="44" rx="9" fill="#1677ff"/>
    <path d="M27 15h13l4 4h15v15H27z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
    <text x="104" y="28" text-anchor="middle" fill="#fff" font-family="Microsoft YaHei,Segoe UI" font-size="14" font-weight="650">打开图片</text>
  </g>
  <g transform="translate(652 500)">
    <rect width="184" height="44" rx="9" fill="#ffffff" stroke="#cfd6df"/>
    <path d="M27 15h13l4 4h15v15H27z" fill="none" stroke="#4e5865" stroke-width="2" stroke-linejoin="round"/>
    <text class="text" x="104" y="28" text-anchor="middle" font-size="14" font-weight="600">打开文件夹</text>
  </g>

  <!-- 悬浮图标轨 -->
  <g filter="url(#floatShadow)"><path d="M0 274h36q16 0 16 16v268q0 16-16 16H0z" fill="#ffffff" fill-opacity=".95"/></g>
  <use href="#brand64" x="12" y="288" width="29" height="29"/>
  <line x1="10" y1="327.5" x2="42" y2="327.5" stroke="#e3e7ed"/>
  <g transform="translate(8 338)"><rect class="railHit" width="36" height="36"/><path class="icon" d="M10 12h16M8 18h20M11 24h14m-11-15v6m8 6v6"/><title>压缩体积</title></g>
  <g transform="translate(8 382)"><rect class="railHit" width="36" height="36"/><path class="icon" d="M8 13h18l-4-4m4 4-4 4M28 23H10l4 4m-4-4 4-4"/><title>转换格式</title></g>
  <g transform="translate(8 426)"><rect class="railHit" width="36" height="36"/><path class="icon" d="M9 11v16m0 0h16m-11-11h13m0 0V9m0 7-5-5"/><title>调整尺寸</title></g>
  <g transform="translate(8 470)"><rect class="railHit" width="36" height="36"/><circle class="icon" cx="13" cy="13" r="3"/><circle class="icon" cx="13" cy="23" r="3"/><path class="icon" d="m16 15 12 12M16 21 27 10"/><title>剪裁尺寸</title></g>
  <g transform="translate(8 522)"><rect class="railHit" width="36" height="36"/><circle class="icon" cx="18" cy="18" r="5"/><path class="icon" d="M18 7v3m0 16v3M7 18h3m16 0h3m-18.8-7.8 2.2 2.2m11.2 11.2 2.2 2.2m0-15.6-2.2 2.2M12.4 23.6l-2.2 2.2"/><title>设置</title></g>
</svg>
