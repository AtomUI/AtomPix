name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  ATOMUI_TOOLS_SOURCE: ${{ github.workspace }}/.artifacts/atomuitools-source
  ATOMUI_TOOLS_BIN: ${{ github.workspace }}/.artifacts/atomuitools
  ATOMUI_TOOLS_MAC_BIN: ${{ github.workspace }}/.artifacts/atomuitools/AtomUITools.Mac
  ATOMUI_TOOLS_LINUX_BIN: ${{ github.workspace }}/.artifacts/atomuitools/AtomUITools.Linux

jobs:
  validate:
    name: Validate release
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate semantic version tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(?<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:[-+][0-9A-Za-z.-]+)?)$') {
            throw "Release tag '$env:RELEASE_TAG' is not a supported semantic version tag."
          }
          "version=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Full release gate
        shell: pwsh
        run: ./eng/verify.ps1

  build-windows:
    name: Build AtomPix-win-x64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore AtomPix.slnx
          dotnet test AtomPix.slnx --configuration Release --no-restore
      - name: Publish Windows package
        shell: pwsh
        run: >
          ./eng/publish.ps1
          -RuntimeIdentifier win-x64
          -Version "${{ needs.validate.outputs.version }}"
          -PublishMode TrimmedSingleFile
      - name: Startup smoke test
        shell: pwsh
        run: ./eng/smoke-test.ps1 -RuntimeIdentifier win-x64 -Seconds 5
      - name: Real-process UI automation
        shell: pwsh
        run: ./eng/windows-ui-automation.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtomPix-win-x64
          path: |
            .artifacts/packages/AtomPix-${{ needs.validate.outputs.version }}-win-x64.zip
            .artifacts/packages/AtomPix-${{ needs.validate.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error

  build-macos:
    name: Build ${{ matrix.artifact_name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            rid: osx-x64
            artifact_name: AtomPix-osx-x64
            installer_root: .artifacts/installer/AtomPix-osx-x64
            output_dir: .artifacts/packages/dmg/x64
          - os: macos-latest
            rid: osx-arm64
            artifact_name: AtomPix-osx-arm64
            installer_root: .artifacts/installer/AtomPix-osx-arm64
            output_dir: .artifacts/packages/dmg/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Apple certificate
        shell: pwsh
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "AtomPixCodeSign.p12"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_P12_BASE64))
          security create-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p $env:KEYCHAIN_PASSWORD build.keychain
          security import $certPath -k build.keychain -P $env:CERT_PASSWORD -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k $env:KEYCHAIN_PASSWORD build.keychain
          Remove-Item -LiteralPath $certPath -Force
          security find-identity -v -p codesigning
      - name: Checkout AtomUITools
        uses: actions/checkout@v4
        with:
          repository: AtomUI/AtomUITools
          ref: develop
          token: ${{ secrets.ACCESS_TOKEN }}
          path: .artifacts/atomuitools-source
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore AtomPix.slnx
          dotnet test AtomPix.slnx --configuration Release --no-restore
      - name: Build AtomUITools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ATOMUI_TOOLS_BIN }}" -Force | Out-Null
          brew install create-dmg
          Set-Location "${{ env.ATOMUI_TOOLS_SOURCE }}/scripts"
          pwsh ./PublishAtomUIToolsLocal.ps1 `
            -publishRootPath "${{ env.ATOMUI_TOOLS_BIN }}" `
            -runtime "${{ matrix.rid }}"
          if (-not (Test-Path -LiteralPath "${{ env.ATOMUI_TOOLS_MAC_BIN }}" -PathType Leaf)) {
            throw "AtomUITools.Mac was not created at ${{ env.ATOMUI_TOOLS_MAC_BIN }}."
          }
      - name: Publish AtomPix
        shell: pwsh
        run: >
          ./eng/publish.ps1
          -RuntimeIdentifier "${{ matrix.rid }}"
          -Version "${{ needs.validate.outputs.version }}"
          -PublishMode TrimmedSingleFile
      - name: Startup smoke test
        shell: pwsh
        run: ./eng/smoke-test.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -Seconds 5
      - name: Stage macOS installer resources
        shell: pwsh
        run: |
          $packages = ".artifacts/publish/${{ matrix.rid }}"
          $configDir = "${{ matrix.installer_root }}/config"
          $imagesDir = "$packages/Assets/Images"
          New-Item -ItemType Directory -Force $configDir, $imagesDir, "${{ matrix.output_dir }}" | Out-Null
          $config = (Get-Content assets/macos/InstallerConfig.xml -Raw).Replace('__VERSION__', '${{ needs.validate.outputs.version }}')
          Set-Content -LiteralPath "$configDir/InstallerConfig.xml" -Value $config -Encoding utf8
          Copy-Item -LiteralPath "assets/macos/AtomPix.icns" -Destination "$imagesDir/AtomPix.icns" -Force
      - name: Create signed DMG
        shell: pwsh
        env:
          CERT_IDENTITY: ${{ secrets.CERT_IDENTITY }}
        run: |
          & "${{ env.ATOMUI_TOOLS_MAC_BIN }}" create-dmg `
            --runtime "${{ matrix.rid }}" `
            --config "${{ matrix.installer_root }}/config/InstallerConfig.xml" `
            --packages ".artifacts/publish/${{ matrix.rid }}" `
            --output "${{ matrix.output_dir }}" `
            --verbosity Detailed `
            --certIdentity $env:CERT_IDENTITY `
            --cleanupBundleOption true
          $artifacts = @(Get-ChildItem -LiteralPath "${{ matrix.output_dir }}" -Filter "*.dmg" -File)
          if ($artifacts.Count -ne 1) { throw "Expected exactly one DMG, found $($artifacts.Count)." }
          $packageName = "AtomPix-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.dmg"
          $packagePath = "${{ matrix.output_dir }}/$packageName"
          Move-Item -LiteralPath $artifacts[0].FullName -Destination $packagePath -Force
          $mountPoint = Join-Path $env:RUNNER_TEMP "atompix-dmg"
          New-Item -ItemType Directory -Force $mountPoint | Out-Null
          try {
            & hdiutil attach -readonly -nobrowse -mountpoint $mountPoint $packagePath
            if ($LASTEXITCODE -ne 0) { throw "Unable to mount $packageName for signature verification." }
            $apps = @(Get-ChildItem -LiteralPath $mountPoint -Filter '*.app' -Directory)
            if ($apps.Count -ne 1) { throw "Expected exactly one application bundle in $packageName, found $($apps.Count)." }
            & codesign --verify --deep --strict --verbose=2 $apps[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Application signature verification failed for $packageName." }
          } finally {
            & hdiutil detach $mountPoint -force
          }
          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName" | Set-Content -LiteralPath "$packagePath.sha256" -Encoding ascii
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.output_dir }}/*.dmg
            ${{ matrix.output_dir }}/*.dmg.sha256
          if-no-files-found: error

  build-linux:
    name: Build ${{ matrix.artifact_name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            appimage_arch: x86_64
            artifact_name: AtomPix-linux-x64
            installer_root: .artifacts/installer/AtomPix-linux-x64
            output_dir: .artifacts/packages/appimage/x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            appimage_arch: aarch64
            artifact_name: AtomPix-linux-arm64
            installer_root: .artifacts/installer/AtomPix-linux-arm64
            output_dir: .artifacts/packages/appimage/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout AtomUITools
        uses: actions/checkout@v4
        with:
          repository: AtomUI/AtomUITools
          ref: develop
          token: ${{ secrets.ACCESS_TOKEN }}
          path: .artifacts/atomuitools-source
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install AppImage dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 patchelf desktop-file-utils file libxcb1 libxcb-shape0 xvfb
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-${{ matrix.appimage_arch }}.AppImage" -O linuxdeploy
          chmod +x linuxdeploy
          sudo mv linuxdeploy /usr/local/bin/linuxdeploy
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage" -O appimagetool
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/appimagetool
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore AtomPix.slnx
          dotnet test AtomPix.slnx --configuration Release --no-restore
      - name: Build AtomUITools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ATOMUI_TOOLS_BIN }}" -Force | Out-Null
          Set-Location "${{ env.ATOMUI_TOOLS_SOURCE }}/scripts"
          pwsh ./PublishAtomUIToolsLocal.ps1 `
            -publishRootPath "${{ env.ATOMUI_TOOLS_BIN }}" `
            -runtime "${{ matrix.rid }}"
          if (-not (Test-Path -LiteralPath "${{ env.ATOMUI_TOOLS_LINUX_BIN }}" -PathType Leaf)) {
            throw "AtomUITools.Linux was not created at ${{ env.ATOMUI_TOOLS_LINUX_BIN }}."
          }
      - name: Publish AtomPix
        shell: pwsh
        run: >
          ./eng/publish.ps1
          -RuntimeIdentifier "${{ matrix.rid }}"
          -Version "${{ needs.validate.outputs.version }}"
          -PublishMode TrimmedSingleFile
      - name: Startup smoke test under Xvfb
        shell: bash
        run: xvfb-run -a pwsh -File ./eng/smoke-test.ps1 -RuntimeIdentifier "${{ matrix.rid }}" -Seconds 5
      - name: Stage Linux installer resources
        shell: pwsh
        run: |
          $packages = ".artifacts/publish/${{ matrix.rid }}"
          $configDir = "${{ matrix.installer_root }}/config"
          $imagesDir = "$packages/Assets/Images"
          $iconsRoot = "$imagesDir/icons"
          New-Item -ItemType Directory -Force $configDir, $imagesDir, $iconsRoot, "${{ matrix.output_dir }}" | Out-Null
          $config = (Get-Content assets/linux/InstallerConfig.xml -Raw).Replace('__VERSION__', '${{ needs.validate.outputs.version }}')
          Set-Content -LiteralPath "$configDir/InstallerConfig.xml" -Value $config -Encoding utf8
          Copy-Item -LiteralPath "assets/linux/icons/hicolor" -Destination $iconsRoot -Recurse -Force
          Copy-Item -LiteralPath "assets/linux/icons/hicolor/256x256/apps/atompix.png" -Destination "$imagesDir/AtomPix.png" -Force
      - name: Make executable
        shell: bash
        run: chmod +x ".artifacts/publish/${{ matrix.rid }}/AtomPix.Desktop"
      - name: Create AppImage
        shell: pwsh
        run: |
          & "${{ env.ATOMUI_TOOLS_LINUX_BIN }}" create-appimage `
            --runtime "${{ matrix.rid }}" `
            --config "${{ matrix.installer_root }}/config/InstallerConfig.xml" `
            --packages ".artifacts/publish/${{ matrix.rid }}" `
            --output "${{ matrix.output_dir }}" `
            --verbosity Detailed `
            --cleanupBundleOption true
          $artifacts = @(Get-ChildItem -LiteralPath "${{ matrix.output_dir }}" -Filter "*.AppImage" -File)
          if ($artifacts.Count -ne 1) { throw "Expected exactly one AppImage, found $($artifacts.Count)." }
          $packageName = "AtomPix-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.AppImage"
          $packagePath = "${{ matrix.output_dir }}/$packageName"
          Move-Item -LiteralPath $artifacts[0].FullName -Destination $packagePath -Force
          chmod +x $packagePath
          $hash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $packageName" | Set-Content -LiteralPath "$packagePath.sha256" -Encoding ascii
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.output_dir }}/*.AppImage
            ${{ matrix.output_dir }}/*.AppImage.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs:
      - validate
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: .artifacts/downloaded
          merge-multiple: true
      - name: Validate release assets
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath .artifacts/downloaded -File)
          if ($assets.Count -ne 10) { throw "Expected five packages and five SHA-256 files, found $($assets.Count) files." }
          $checksums = @($assets | Where-Object Extension -eq '.sha256')
          if ($checksums.Count -ne 5) { throw "Expected five SHA-256 files, found $($checksums.Count)." }
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: .artifacts/downloaded/*
          generate_release_notes: true
